<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport">

		<style>
			.pageNum {
				position: fixed;
				left: 1vw;
				top: 1vh;
				width: 3vw;
				hiehgt: 3vh;
			}
			body {
				color: rgb(50, 50, 50);
				width: 100%;
				height: 100%;
				text-align: center;
				background-color: gray;
				font-size: 300%;
				overflow-x: hidden;
				overflow-y: hidden;
			}
			table {
				border: 3px double black;
				text-align: center;
				font-weight: bold;
			}
			tr {
				border: 2px solid black;
				width: 98vw;
				height: 6vh;
			}
			td {
				background-color: rgb(231, 225, 219);
			}
			td.small {
				border: 2px solid black;
				width: 20vw;
				height: 6vh;
			}
			td.big {
				border: 2px solid black;
				width: 28vw;
				height: 6vh;
			}
			td.tableCellHighlighted {
				background-color: rgb(148, 194, 220);
			}
			.converter {
				color: rgb(240, 240, 100);
				width: 100%;
				background-color: rgb(60, 100, 20);
				margin: 0 0 0 0;
				padding: 3vh 0 3vh 0;
				min-width: 300px;
				overflow-x: auto;
				text-align: center;
				font-weight: bold;
			}
			.twoWayConverter {
				display: flex;
				align-items: center;
				width: max(288px, 96vmin);
				height: max(44px, 11vmin);
				font-size: max(14px, 6vmin);
			}
			.twoWayConverter label {
				flex-shrink: 0;
				width: max(48px, 16vmin);
				height: max(36px, 9vmin);
				margin: max(2px, 0.5vmin);
				font-size: 0.8em;
			}
			.twoWayConverter input {
				flex: 1;
				min-width: 0;
				height: max(36px, 9vmin);
				font-weight: bold;
				caret-color: black;
				margin: max(2px, 0.5vmin);
				font-size: 0.8em;
				border-radius: max(9px, 3vmin);
				background-color: rgb(180, 180, 150);
			}
			.twoWayConverter input:focus {
				background-color: rgb(240, 240, 200);
			}

			.oneWayConverter {
				width: max(288px, 96vmin);
				height: max(90px, 30vmin);
				font-size: max(16px, 8vmin);
			}
			.oneWayConverter label {
				display: inline-block;
				width: max(114px, 38vmin);
				height: max(44px, 11vmin);
				margin: auto;
				font-size: 0.8em;
			}
			.oneWayConverter input {
				display: inline-block;
				width: max(105px, 35vmin);
				height: max(36px, 9vmin);
				font-weight: bold;
				caret-color: black;
				margin: max(3px, 1vmin);
				font-size: 1em;
				border-radius: max(9px, 3vmin);
				background-color: rgb(180, 180, 150);
			}
			.oneWayConverter input:focus {
				background-color: rgb(240, 240, 200);
			}
			.oneWayConverter div {
				display: block;
				width: max(288px, 96vmin);
				height: max(60px, 20vmin);
				color: #c0c0c0;
				margin: max(3px, 1vmin);
				font-size: 1em;
			}
			.textInput {
				width: 18vw;
				height: 6vh;
				text-align: center;
				font-size: 100%;
				font-weight: bold;
				caret-color: black;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.textInput:focus {
				border: 0.6vh solid rgb(148, 194, 220);
			}
			.textInputLong {
				width: 23vw;
				height: 6vh;
				text-align: center;
				font-size: 100%;
				font-weight: bold;
				caret-color: black;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.textInputLong:focus {
				border: 0.6vh solid rgb(148, 194, 220);
			}
			.label {
				width: 16vw;
				height: 8vh;
				text-align: center;
				font-size: 100%;
				font-weight: bold;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.labelHeavy {
				width: 16vw;
				height: 8vh;
				text-align: center;
				font-size: 120%;
				font-weight: bold;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.labelLong {
				width: 20vw;
				height: 8vh;
				text-align: center;
				font-size: 100%;
				font-weight: bold;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.buttonLong {
				width: 40vw;
				height: 7vh;
				text-align: center;
				font-size: 130%;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.button {
				width: 25vw;
				height: 7vh;
				text-align: center;
				font-size: 130%;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.buttonShort {
				width: 15vw;
				height: 7vh;
				text-align: center;
				font-size: 100%;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.buttonBold {
				width: 25vw;
				height: 7vh;
				text-align: center;
				font-size: 130%;
				font-weight: bold;
				background-color: rgba(190, 230, 190, 1);
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			.redBackground {
				background-color: rgba(230, 170, 170, 1);
			}
			#optionGroup {
				width: 97vw;
				height: 38vh;
				text-align: center;
				font-size: 100%;
				overflow-x: scroll;
				overflow-y: scroll;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
			}
			#outputGroupParent {
				width: 97vw;
				height: 60vh;
				text-align: center;
				font-size: 100%;
				overflow-x: scroll;
				overflow-y: scroll;
				margin-left: 1vw;
				margin-right: 1vw;
				margin-top: 0.5vh;
				margin-bottom: 0.5vh;
				background-color: rgba(100, 100, 100, 1);
			}
			#outputGroup {
				width: 97vw;
				height: 60vh;
				text-align: center;
				font-size: 100%;
				background-color: rgba(100, 100, 100, 1);
			}
			::placeholder { /* Chrome, Firefox, Opera, Safari 10.1+ */
				color: rgba(185, 185, 185, 1);
				opacity: 1; /* Firefox */
			}
			:-ms-input-placeholder { /* Internet Explorer 10-11 */
				color: rgba(185, 185, 185, 1);
			}
			::-ms-input-placeholder { /* Microsoft Edge */
				color: rgba(185, 185, 185, 1);
			}
		</style>
	</head>
	<body>
    <div class="pageNum">1</div>
		<div id="optionGroup">
			<div>
				<button id="toKgButton" class="buttonBold" onclick="toKg()">kg</button>
				<button id="toLbButton" class="buttonBold" onclick="toLb()">lb</button>
			</div>
			<div>
				<button id="loadButton" class="button" onclick="load()">열기</button>
			</div>
			<div>
				<span id="labelBL" class="labelHeavy">B/L</span>
				<input id="inputBL" type="number" class="textInput"></input>
			</div>
			<div>
				<button id="label1" class="label" disabled>코드</button>
				<button id="label2" class="labelLong" disabled>C/T</button>
				<button id="label3" class="labelLong" disabled>Kg</button>
				<button id="label4" class="label" disabled>EST</button>
			</div>
			<div id="buttonGroup">
				<button id="removeButton" class="buttonShort redBackground" onclick="removeOption()">➖</button>
				<span>&nbsp;</span>
				<button id="addButton" class="buttonShort" onclick="addOption()">➕</button>
				<span>&nbsp;&nbsp;&nbsp;</span>
				<button id="saveButton" class="buttonShort" onclick="save()">저장</button>
				<button id="calcButton" class="buttonBold" onclick="calculate()">계산</button>
			</div>
		</div>
		<div id="outputGroupParent">
			<div id="outputGroup1">
			</div>
			<div class="converter">
				<div class="twoWayConverter">
					<label>C net</label>
					<input id="cNetInput" type="number"></input>
					<input id="cGrossInput" type="number"></input>
					<label>C gross</label>
				</div>
				<div class="twoWayConverter">
					<label>D net</label>
					<input id="dNetInput" type="number"></input>
					<input id="dGrossInput" type="number"></input>
					<label>D gross</label>
				</div>
				<div class="twoWayConverter">
					<label>T net</label>
					<input id="netSumInput" type="number"></input>
					<input id="grossSumInput" type="number"></input>
					<label>T gross</label>
				</div>
			</div>
			<div id="outputGroup2">
		</div>
		</div>

		<script>
			let saveData = {};

			let loading = false;
			let bl = "";
			let weightUnit = "kg";

			var viewport = document.querySelector("meta[name=viewport]");
			viewport.setAttribute("content", "width=" + window.innerWidth + ", height=" + window.innerHeight + ", user-scalable=0");

			const optionGroup = document.getElementById("optionGroup");
			const buttonGroup = document.getElementById("buttonGroup");
			const outputGroupParent = document.getElementById("outputGroupParent");
			const outputGroup1 = document.getElementById("outputGroup1");
			const outputGroup2 = document.getElementById("outputGroup2");
			const removeButton = document.getElementById("removeButton");
			const addButton = document.getElementById("addButton");
			const calcButton = document.getElementById("calcButton");
			const toKgButton = document.getElementById("toKgButton");
			const toLbButton = document.getElementById("toLbButton");
			const loadButton = document.getElementById("loadButton");
			const saveButton = document.getElementById("saveButton");
			const label1 = document.getElementById("label1");
			const label2 = document.getElementById("label2");
			const label3 = document.getElementById("label3");
			const label4 = document.getElementById("label4");
			const labelBL = document.getElementById("labelBL");
			const inputBL = document.getElementById("inputBL");

			removeButton.style.display = 'none';
			addButton.style.display = 'none';
			calcButton.style.display = 'none';
			saveButton.style.display = 'none';
			label1.style.display = 'none';
			label2.style.display = 'none';
			label3.style.display = 'none';
			label4.style.display = 'none';

			const optionList = [];

			function load()
			{
				loading = true;
				const dataStr = localStorage.getItem("sheetCalcSaveData_1");
				if (dataStr != undefined && dataStr != null && dataStr != "")
				{
					saveData = JSON.parse(dataStr);
					bl = saveData.bl;
					weightUnit = saveData.weightUnit;
					if (weightUnit == "kg")
						toKg(false);
					else
						toLb(false);

					for (const op of saveData.optionList)
					{
						addOption();
						const option = optionList[optionList.length-1];
						option.children[0].value = op.v1;
						option.children[1].value = op.v2;
						option.children[2].value = op.v3;
						option.children[3].value = op.v4;
					}
				}
				loading = false;
			}

			function save()
			{
				saveData.bl = bl;
				saveData.weightUnit = weightUnit;
				saveData.optionList = [];
				for (const option of optionList)
				{
					saveData.optionList.push({
						v1: option.children[0].value,
						v2: option.children[1].value,
						v3: option.children[2].value,
						v4: option.children[3].value,
					});
				}
				localStorage.setItem("sheetCalcSaveData_1", JSON.stringify(saveData));
			}

			function toKg(addFirstOption = true)
			{
				if (!loading)
					bl = inputBL.value;
				weightUnit = "kg";
				label3.innerHTML = "kg";

				removeButton.style.display = 'inline';
				addButton.style.display = 'inline';
				calcButton.style.display = 'inline';
				saveButton.style.display = 'inline';
				label1.style.display = 'inline';
				label2.style.display = 'inline';
				label3.style.display = 'inline';
				label4.style.display = 'inline';

				toKgButton.style.display = 'none';
				toLbButton.style.display = 'none';
				loadButton.style.display = 'none';
				labelBL.style.display = 'none';
				inputBL.style.display = 'none';

				if (addFirstOption)
					addOption();
			}
			function toLb(addFirstOption = true)
			{
				if (!loading)
					bl = inputBL.value;
				weightUnit = "lb";
				label3.innerHTML = "lb";

				removeButton.style.display = 'inline';
				addButton.style.display = 'inline';
				calcButton.style.display = 'inline';
				saveButton.style.display = 'inline';
				label1.style.display = 'inline';
				label2.style.display = 'inline';
				label3.style.display = 'inline';
				label4.style.display = 'inline';

				toKgButton.style.display = 'none';
				toLbButton.style.display = 'none';
				loadButton.style.display = 'none';
				labelBL.style.display = 'none';
				inputBL.style.display = 'none';

				if (addFirstOption)
					addOption();
			}

			function addOption()
			{
				const newOptionIndex = optionList.length;

				if (newOptionIndex > 1000)
				{
					alert("옵션이 너무 많습니다!");
					return;
				}

				const option = document.createElement("div");

				const v1 = document.createElement("input");
				v1.className = "textInput";
				v1.setAttribute("placeholder", "코드");
				v1.setAttribute("inputmode", "email");
				v1.setAttribute("lang", "en");
				v1.type = "text";
				v1.oninput = function() { v1.value = v1.value.toUpperCase(); };
				option.appendChild(v1);

				const v2 = document.createElement("input");
				v2.className = "textInputLong";
				v2.setAttribute("placeholder", "C/T");
				v2.type = "number";
				v2.step = "1";
				option.appendChild(v2);

				const v3 = document.createElement("input");
				v3.className = "textInputLong";
				v3.setAttribute("placeholder", weightUnit);
				v3.type = "number";
				option.appendChild(v3);

				const v4 = document.createElement("input");
				v4.className = "textInput";
				v4.setAttribute("placeholder", "EST");
				v4.setAttribute("inputmode", "email");
				v4.setAttribute("lang", "en");
				v4.type = "text";
				v4.oninput = function() { v4.value = v4.value.toUpperCase(); };
				option.appendChild(v4);

				optionGroup.appendChild(option);
				optionList.push(option);

				buttonGroup.remove();
				optionGroup.appendChild(buttonGroup);

				optionGroup.scrollTop = optionGroup.scrollHeight;
			}

			function removeOption()
			{
				if (optionList.length > 0)
				{
					optionList.splice(optionList.length-1, 1)[0].remove();
					optionGroup.scrollTop = optionGroup.scrollHeight;
				}
			}

			function calculate()
			{
				const optionMap = {};
				let totalV2 = 0;
				let totalV3 = 0;

				for (let i = 0; i < optionList.length; ++i)
				{
					const option = optionList[i];
					const v1 = option.children[0].value;
					const v2 = parseInt(option.children[1].value);
					const v3 = parseFloat(option.children[2].value);
					const v4 = option.children[3].value;

					if (Number.isNaN(v2) || Number.isNaN(v3))
					{
						alert("(오류) 잘못된 입력값입니다.");
						return;
					}
					totalV2 += v2;
					totalV3 += v3;

					// Key1 = v1, Key2 = v4
					if (optionMap[v1] == undefined)
						optionMap[v1] = {};
					if (optionMap[v1][v4] == undefined)
						optionMap[v1][v4] = {sumV2: 0, sumV3: 0};

					optionMap[v1][v4].sumV2 += v2;
					optionMap[v1][v4].sumV3 += v3;
				}

				while (outputGroup1.children != undefined && outputGroup1.children != null && outputGroup1.children.length > 0)
					outputGroup1.children[0].remove();
				while (outputGroup2.children != undefined && outputGroup2.children != null && outputGroup2.children.length > 0)
					outputGroup2.children[0].remove();

				const table1 = document.createElement("table");
				outputGroup1.appendChild(table1);

				const totalRow1 = document.createElement("tr");
				table1.appendChild(totalRow1);

				const colTotalBLLabel = document.createElement("td");
				colTotalBLLabel.classList.add("big");
				colTotalBLLabel.classList.add("tableCellHighlighted");
				colTotalBLLabel.innerHTML = "B/L";
				totalRow1.appendChild(colTotalBLLabel);
				const colTotalV2Label = document.createElement("td");
				colTotalV2Label.classList.add("big");
				colTotalV2Label.classList.add("tableCellHighlighted");
				colTotalV2Label.innerHTML = "C/T 합계";
				totalRow1.appendChild(colTotalV2Label);
				const colTotalV3Label = document.createElement("td");
				colTotalV3Label.classList.add("big");
				colTotalV3Label.classList.add("tableCellHighlighted");
				colTotalV3Label.innerHTML = "kg 합계";
				totalRow1.appendChild(colTotalV3Label);

				if (weightUnit == "lb")
				{
					const colTotalV3Label2 = document.createElement("td");
					colTotalV3Label2.classList.add("big");
					colTotalV3Label2.classList.add("tableCellHighlighted");
					colTotalV3Label2.innerHTML = "lb 합계";
					totalRow1.appendChild(colTotalV3Label2);
				}

				const totalRow2 = document.createElement("tr");
				table1.appendChild(totalRow2);

				const colTotalBL = document.createElement("td");
				colTotalBL.classList.add("big");
				colTotalBL.innerHTML = bl;
				totalRow2.appendChild(colTotalBL);

				const colTotalV2 = document.createElement("td");
				colTotalV2.classList.add("big");
				colTotalV2.innerHTML = totalV2.toString();
				totalRow2.appendChild(colTotalV2);

				const colTotalV3 = document.createElement("td");
				colTotalV3.classList.add("big");
				if (weightUnit == "kg")
					colTotalV3.innerHTML = totalV3.toFixed(3);
				else
					colTotalV3.innerHTML = (totalV3 * 0.453592).toFixed(3);
				totalRow2.appendChild(colTotalV3);

				if (weightUnit == "lb")
				{
					const colTotalV3_2 = document.createElement("td");
					colTotalV3_2.classList.add("big");
					colTotalV3_2.innerHTML = totalV3.toFixed(3);
					totalRow2.appendChild(colTotalV3_2);
				}

				const tableM = document.createElement("table");
				outputGroup1.appendChild(tableM);

				const rrr = document.createElement("tr");
				tableM.appendChild(rrr);

				const ccc1 = document.createElement("td");
				ccc1.classList.add("tableCellHighlighted");
				ccc1.classList.add("big");
				ccc1.innerHTML = "코드";
				rrr.appendChild(ccc1);

				const ccc2 = document.createElement("td");
				ccc2.classList.add("tableCellHighlighted");
				ccc2.classList.add("big");
				ccc2.innerHTML = "C/T 합계";
				rrr.appendChild(ccc2);

				const ccc3 = document.createElement("td");
				ccc3.classList.add("tableCellHighlighted");
				ccc3.classList.add("big");
				ccc3.innerHTML = "kg 합계";
				rrr.appendChild(ccc3);

				const sorted = Object.entries(optionMap).sort((kvp1, kvp2) => kvp1[0] < kvp2[0] ? -1 : 1);
				for (const [v1, optionMapByV1] of sorted)
				{
					const rr = document.createElement("tr");
					tableM.appendChild(rr);

					let v2Summed = 0;
					let v3Summed = 0;
					const sorted2 = Object.entries(optionMapByV1).sort((kvp1, kvp2) => kvp1[0] < kvp2[0] ? -1 : 1);
					for (const [v4, optionInfo] of sorted2)
					{
						v2Summed += optionInfo.sumV2;
						v3Summed += optionInfo.sumV3;
					}

					const cc1 = document.createElement("td");
					cc1.classList.add("big");
					cc1.innerHTML = v1;
					rr.appendChild(cc1);

					const cc2 = document.createElement("td");
					cc2.classList.add("big");
					cc2.innerHTML = v2Summed;
					rr.appendChild(cc2);

					const cc3 = document.createElement("td");
					cc3.classList.add("big");
					if (weightUnit == "kg")
						cc3.innerHTML = v3Summed.toFixed(3);
					else
						cc3.innerHTML = (v3Summed * 0.453592).toFixed(3);
					rr.appendChild(cc3);
				}

				const table2 = document.createElement("table");
				outputGroup2.appendChild(table2);
				const tbody = document.createElement("tbody");
				table2.appendChild(tbody);

				const titleRow = document.createElement("tr");
				tbody.appendChild(titleRow);
				const c1 = document.createElement("td");
				c1.classList.add("tableCellHighlighted");
				c1.classList.add("small");
				c1.innerHTML = "코드";
				titleRow.appendChild(c1);
				const c4 = document.createElement("td");
				c4.classList.add("tableCellHighlighted");
				c4.classList.add("small");
				c4.innerHTML = "EST";
				titleRow.appendChild(c4);
				const c2 = document.createElement("td");
				c2.classList.add("tableCellHighlighted");
				c2.classList.add("big");
				c2.innerHTML = "C/T";
				titleRow.appendChild(c2);
				const c3 = document.createElement("td");
				c3.classList.add("tableCellHighlighted");
				c3.classList.add("big");
				c3.innerHTML = "kg";
				titleRow.appendChild(c3);

				const sorted3 = Object.entries(optionMap).sort((kvp1, kvp2) => kvp1[0] < kvp2[0] ? -1 : 1);
				for (const [v1, optionMapByV1] of sorted3)
				{
					const row1 = document.createElement("tr");
					tbody.appendChild(row1);

					const col1 = document.createElement("td");
					col1.setAttribute("rowspan", Object.keys(optionMapByV1).length);
					col1.classList.add("small");
					col1.innerHTML = v1;
					row1.appendChild(col1);

					let firstV4 = true;
					const sorted4 = Object.entries(optionMapByV1).sort((kvp1, kvp2) => kvp1[0] < kvp2[0] ? -1 : 1);
					for (const [v4, optionInfo] of sorted4)
					{
						let colParent = row1;
						if (!firstV4)
						{
							const row2 = document.createElement("tr");
							tbody.appendChild(row2);
							colParent = row2;
						}

						const col2 = document.createElement("td");
						col2.classList.add("small");
						col2.innerHTML = v4;
						colParent.appendChild(col2);

						const col3 = document.createElement("td");
						col3.classList.add("big");
						col3.innerHTML = optionInfo.sumV2;
						colParent.appendChild(col3);

						const col4 = document.createElement("td");
						col4.classList.add("big");
						if (weightUnit == "kg")
							col4.innerHTML = optionInfo.sumV3.toFixed(3);
						else
							col4.innerHTML = (optionInfo.sumV3 * 0.453592).toFixed(3);
						colParent.appendChild(col4);

						if (firstV4)
							firstV4 = false;
					}
				}

				const spacer2 = document.createElement("div");
				spacer2.style = "height: 10vh; background-color: rgb(148, 194, 220);";
				outputGroup2.appendChild(spacer2);

				outputGroupParent.scrollTop = 0;
			}

			//------------------------------------------------------------------------
			// D, C, Net, Gross
			//------------------------------------------------------------------------

			const dNetInput = document.getElementById("dNetInput");
			const dGrossInput = document.getElementById("dGrossInput");
			const cNetInput = document.getElementById("cNetInput");
			const cGrossInput = document.getElementById("cGrossInput");
			const netSumInput = document.getElementById("netSumInput");
			const grossSumInput = document.getElementById("grossSumInput");

			const calcDC = function(changeTarget) {
				let dNet = parseFloat(dNetInput.value.trim());
				let dGross = parseFloat(dGrossInput.value.trim());
				let cNet = parseFloat(cNetInput.value.trim());
				let cGross = parseFloat(cGrossInput.value.trim());
				let netSum = parseFloat(netSumInput.value.trim());
				let grossSum = parseFloat(grossSumInput.value.trim());

				if (Number.isNaN(dNet)) dNet = 0;
				if (Number.isNaN(dGross)) dGross = 0;
				if (Number.isNaN(cNet)) cNet = 0;
				if (Number.isNaN(cGross)) cGross = 0;
				if (Number.isNaN(netSum)) netSum = 0;
				if (Number.isNaN(grossSum)) grossSum = 0;

				if (changeTarget == "net" && dGross > 0 && cGross > 0 && netSum > 0) // compute dNet, cNet
				{
					grossSum = dGross + cGross;
					dNet = netSum * (dGross / grossSum);
					cNet = netSum * (cGross / grossSum);
				}
				else if (changeTarget == "gross" && dNet > 0 && cNet > 0 && grossSum > 0) // compute dGross, cGross
				{
					netSum = dNet + cNet;
					dGross = grossSum * (dNet / netSum);
					cGross = grossSum * (cNet / netSum);
				}

				dNetInput.value = (dNet <= 0) ? "" : dNet.toFixed(4);
				dGrossInput.value = (dGross <= 0) ? "" : dGross.toFixed(4);
				cNetInput.value = (cNet <= 0) ? "" : cNet.toFixed(4);
				cGrossInput.value = (cGross <= 0) ? "" : cGross.toFixed(4);
				netSumInput.value = (netSum <= 0) ? "" : netSum.toFixed(4);
				grossSumInput.value = (grossSum <= 0) ? "" : grossSum.toFixed(4);
			};

			dNetInput.addEventListener("change", function() { calcDC("gross"); });
			dGrossInput.addEventListener("change", function() { calcDC("net"); });
			cNetInput.addEventListener("change", function() { calcDC("gross"); });
			cGrossInput.addEventListener("change", function() { calcDC("net"); });
			netSumInput.addEventListener("change", function() { calcDC("net"); });
			grossSumInput.addEventListener("change", function() { calcDC("gross"); });
		</script>
	</body>
</html>
